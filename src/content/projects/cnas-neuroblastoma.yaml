title: CNAs in neuroblastoma
image: https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41467-024-47945-7/MediaObjects/41467_2024_47945_Fig1_HTML.png?as=webp
description: >-
  Many pediatric cancers are associated with copy number alterations (CNAs).
  Making use of the Tsakiridis lab's stem cell model of the trunk neural
  crest, we investigated their role in neuroblastoma tumorigenesis.
order: 2
